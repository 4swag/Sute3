<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>swagbot.dev // XMB Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="info">
  <div class="wave-bg" aria-hidden="true"></div>

  <main class="xmb-shell" aria-label="PlayStation-style profile dashboard">
    <header class="shell-top">
      <div>
        <p class="micro">USER // 4SWAG</p>
        <h1>SWAGBOT.DEV</h1>
      </div>
      <p class="micro">XMB PROFILE MODE</p>
    </header>

    <section class="xmb-row" aria-label="Main profile icons">
      <button class="xmb-icon is-active" data-key="info" aria-selected="true">
        <span class="glyph">◉</span>
        <span class="label">Info</span>
      </button>
      <button class="xmb-icon" data-key="music" aria-selected="false">
        <span class="glyph">♫</span>
        <span class="label">Music</span>
      </button>
      <button class="xmb-icon" data-key="links" aria-selected="false">
        <span class="glyph">⌁</span>
        <span class="label">Links</span>
      </button>
      <button class="xmb-icon" data-key="presence" aria-selected="false">
        <span class="glyph">◎</span>
        <span class="label">Presence</span>
      </button>
      <button class="xmb-icon" data-key="cheats" aria-selected="false">
        <span class="glyph">✦</span>
        <span class="label">Cheats</span>
      </button>
      <button class="xmb-icon" data-key="favorites" aria-selected="false">
        <span class="glyph">▣</span>
        <span class="label">Favorites</span>
      </button>
      <button class="xmb-icon" data-key="scene" aria-selected="false">
        <span class="glyph">◌</span>
        <span class="label">Scene</span>
      </button>
    </section>

    <section class="xmb-panel" aria-live="polite">
      <p id="panelEyebrow" class="panel-eyebrow">INFO CHANNEL</p>
      <h2 id="panelTitle">4swag / identity stream</h2>
      <p id="panelText" class="panel-text"></p>
      <div id="panelMeta" class="panel-meta"></div>
    </section>

    <footer class="shell-footer">
      <span>controls: ← → navigate • enter open • esc reset</span>
      <span id="stamp">swagbot.dev // ps3 mood</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
