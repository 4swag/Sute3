<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>swagbot.dev // Console Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="info">
  <div class="bg-layer" aria-hidden="true"></div>

  <main class="dashboard" aria-label="Personal console dashboard">
    <header class="topbar glass">
      <div>
        <p class="system-label">USER PROFILE SYSTEM</p>
        <h1>4swag // swagbot.dev</h1>
      </div>
      <p class="status-pill">STATUS: ONLINE · CS2 SESSION READY</p>
    </header>

    <section class="menu-wrap" aria-label="Main dashboard sections">
      <div id="tileRail" class="tile-rail" role="tablist" aria-label="Console menu rail">
        <button class="tile is-active" role="tab" data-key="info" aria-selected="true">
          <span class="tile-kicker">01</span>
          <span class="tile-title">Info</span>
          <span class="tile-sub">identity + vibe</span>
        </button>
        <button class="tile" role="tab" data-key="links" aria-selected="false">
          <span class="tile-kicker">02</span>
          <span class="tile-title">Links</span>
          <span class="tile-sub">where to tap in</span>
        </button>
        <button class="tile" role="tab" data-key="music" aria-selected="false">
          <span class="tile-kicker">03</span>
          <span class="tile-title">Music</span>
          <span class="tile-sub">rotation + influence</span>
        </button>
        <button class="tile" role="tab" data-key="presence" aria-selected="false">
          <span class="tile-kicker">04</span>
          <span class="tile-title">Presence</span>
          <span class="tile-sub">handles + scene</span>
        </button>
        <button class="tile" role="tab" data-key="favorites" aria-selected="false">
          <span class="tile-kicker">05</span>
          <span class="tile-title">Favorites</span>
          <span class="tile-sub">games + phrases</span>
        </button>
        <button class="tile" role="tab" data-key="underground" aria-selected="false">
          <span class="tile-kicker">06</span>
          <span class="tile-title">Scene / Underground</span>
          <span class="tile-sub">coded language</span>
        </button>
      </div>
    </section>

    <section class="detail-panel glass" aria-live="polite">
      <p id="detailLabel" class="detail-label">INFO MODULE</p>
      <h2 id="detailTitle">4swag / personal signal</h2>
      <p id="detailCopy" class="detail-copy"></p>
      <div id="detailItems" class="detail-items"></div>
    </section>

    <footer class="footer glass">
      <p>NAV: ← / → to move • Enter to open links • Esc to reset</p>
      <p id="footerStamp">swagbot.dev // custom dashboard</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
